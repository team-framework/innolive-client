services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_INNOLIVE_SIGNALING_URL: ${NEXT_PUBLIC_INNOLIVE_SIGNALING_URL:?NEXT_PUBLIC_INNOLIVE_SIGNALING_URL must be set in .env}
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    profiles: ["standalone-proxy"]
    env_file: .env
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
