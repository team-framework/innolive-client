# 프로젝트 전체 Gradle 설정입니다.
# IDE(예: Android Studio) 사용자:
# IDE에서 구성한 Gradle 설정은 이 파일에 지정한 설정을 *덮어씁니다*.
# 빌드 환경 구성은 다음 문서를 참고합니다.
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 데몬 프로세스에 쓰는 JVM 인자를 지정합니다.
# 특히 메모리 설정을 조정할 때 유용합니다.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 설정하면 Gradle이 실험적인 병렬 모드로 실행됩니다.
# 분리된 프로젝트에서만 써야 합니다. 자세한 내용은 다음 문서를 참고합니다.
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Configuration Cache를 켜면 빌드 스크립트 등 빌드 구성에 영향을 주는 것이 바뀌지 않았을 때
# 구성 단계를 통째로 건너뜁니다. 또한 작업 실행에 성능 최적화를 적용합니다.
org.gradle.configuration-cache=true
# 이 프로젝트의 Kotlin 코드 스타일: "official" 또는 "obsolete":
kotlin.code.style=official
# LiteRT 2.2.0 implementation/API AAR이 같은 namespace를 게시합니다.
# 상위 라이브러리가 서로 다른 namespace를 쓰게 되면(AGP 10에서 필수) 이 우회 설정을 제거합니다.
android.uniquePackageNames=false
