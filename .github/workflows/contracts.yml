name: Verify contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/verify-contracts.sh"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify contract JSON
        run: ./scripts/verify-contracts.sh

